name: Update Recruitment Timeline

on:
  repository_dispatch:
    types: update-recruitment-timeline

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Use Yarn Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}
          restore-keys: yarn-
      - name: Install
        run: yarn
      - name: Update recruitment timeline JSON
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RECRUITMENT_TIMELINE_CONTENT: ${{ github.event.client_payload.content }}
        run: yarn workspace new-dti-website-redesign run pull-recruitment-timeline
